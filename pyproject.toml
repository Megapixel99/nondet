[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nondet"
version = "0.2.1"
description = "Run a function in fresh processes and see if it answers the same. A witness is a fact; agreement is not."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = [
  "determinism", "nondeterminism", "reproducibility", "purity", "side-effects",
  "hash-randomisation", "pythonhashseed", "memoize", "caching", "flaky",
  "testing", "zero-dependency",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
nondet = "nondet.cli:main"

[tool.setuptools]
packages = ["nondet"]
