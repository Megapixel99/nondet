# A determinism checker has to answer for its own determinism, and for its own mess.
#
# Three gates here are this package's own properties pointed back at the package:
#
#   1. IT IS POINTED AT ITSELF. A tool that finds nondeterministic functions and has
#      never been run over its own source is making a claim it has not checked.
#
#   2. THE TREE MUST BE CLEAN AFTERWARDS. This package EXECUTES the code it probes.
#      The first ungated run against a real tree created five directories and a config
#      file on disk, named after ladder values, because the functions it called wrote
#      files. The safety gate exists because of that, and this is the check that the
#      gate is still doing its job.
#
#   3. THE FIXTURE MEASUREMENT IS RE-RUN, NOT QUOTED. The README claims 9 of 9 caught,
#      0 of 10 falsely flagged and 1 of 10 returned as a `look`. A number in a README
#      that nothing recomputes is a number that was true once — and the `look` row is
#      the one that needs recomputing most, because a `look` is never a finding and so
#      never moves the other two.
#
#   4. THE COUNTS ARE READ, NOT THE EXIT CODES. A package about denominators cannot
#      have steps that pass with a zero one. A suite that collected nothing exits 0,
#      and so does a `nondet` run that found no functions to probe — the same 0 as a
#      suite of thirty-four and a scan that walked the whole tree. The three steps that
#      could pass that way are wrapped in `didrun` and `zerocase`, which take a floor
#      and a place to read the number, and which are Seth's for the same reason this is.
#
# Action versions are pinned at v7 deliberately. Older majors still run, on a Node the
# runner silently substitutes, and a pin that is wrong for its own runtime is invisible
# in a pass/fail — you only see it in an annotation nobody reads.
name: ci

on:
  push:
    # `master` only. A branch with an open PR matches both triggers and every job runs
    # twice, and a concurrency group does NOT fix it: the push event keys on
    # `refs/heads/<branch>` while the pull_request event keys on `<branch>`, so they
    # land in different groups.
    branches: [master]
  pull_request:
  workflow_dispatch:
  # `release.yml` calls this workflow rather than copying the jobs into itself.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what `pyproject.toml` claims, and the claim is checked rather
        # than trusted: `requires-python = ">=3.9"` is a promise, and a promise nothing
        # runs is the stale-documentation defect in a metadata file.
        python-version: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: no dependencies, and that is a design constraint
        run: |
          if python3 -c "import nondet, nondet.core, nondet.cli" 2>&1 \
             | grep -q "ModuleNotFoundError"; then
            echo "::error::nondet imported something outside the standard library"
            exit 1
          fi
          python3 -c "import nondet; print('nondet', nondet.__version__)"

      - name: the counting tools
        # `didrun` reads a count out of a command's own output and puts a floor under
        # it; `zerocase` does the same to a report the runner wrote. Neither is a
        # dependency of this package — they are installed on the runner and used from
        # PATH, so the standard-library constraint above is untouched.
        #
        # BOTH ARE NAMED, even though `zerocase` depends on `didrun`. npm links the
        # executables of what you asked for and not of its dependencies, so installing
        # `zerocase` alone leaves no `didrun` on PATH.
        #
        # The Node floor is asserted rather than assumed, for the same reason as the
        # hash-randomisation step below: both tools declare `node >= 20`, and a runner
        # image that quietly ships something older would fail these steps with a syntax
        # error, which is the wrong sentence to have to debug.
        run: |
          if [ "$(node -p 'process.versions.node.split(".")[0]')" -lt 20 ]; then
            echo "::error::didrun and zerocase declare node >= 20; this runner has $(node --version)"
            exit 1
          fi
          npm install -g zerocase @megapixel99/didrun
          didrun --help > /dev/null
          zerocase --help > /dev/null
          echo "node $(node --version); didrun and zerocase are on PATH"

      - name: the suites
        # WRAPPED, and this is the whole point of the wrapper: `unittest discover`
        # pointed at a directory holding no tests prints `Ran 0 tests` and does not
        # fail. Whether that is an exit 0 is a Python-version detail; the count is not,
        # and the count is what is read here.
        #
        # 34 is the floor because 34 is what this suite has. Adding a test passes.
        # Losing the suite — a rename, a moved directory, a discovery pattern that stops
        # matching — is what this catches, and it is the failure that otherwise arrives
        # as a green tick.
        run: |
          didrun --expect-count 'Ran ([0-9]+) tests?' --min 34 \
            -- python3 -m unittest discover -s tests -v

      - name: hash randomisation is actually on
        # The flagship defect is invisible without it. A runner that pinned
        # PYTHONHASHSEED globally would make the whole suite pass while the package's
        # central claim went untested — so the premise is asserted, not assumed.
        run: |
          a=$(python3 -c "print(hash('alpha'))")
          b=$(python3 -c "print(hash('alpha'))")
          echo "two processes hashed 'alpha' as $a and $b"
          if [ "$a" = "$b" ]; then
            echo "::error::string hashing is not randomised here; the flagship test proves nothing"
            exit 1
          fi

      - name: the tree came back
        # This package runs other people's functions. The safety gate is what keeps it
        # from writing to the tree, and this is the check that the gate held.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::probing left artefacts in the tree — the safety gate did not hold"
            git status --porcelain
            exit 1
          fi
          echo "clean"

  measured:
    # The README's numbers, recomputed. Not a smoke test: these are the claims.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: the counting tools
        # Installed as in `suite`; the argument for naming both is there.
        run: |
          if [ "$(node -p 'process.versions.node.split(".")[0]')" -lt 20 ]; then
            echo "::error::didrun and zerocase declare node >= 20; this runner has $(node --version)"
            exit 1
          fi
          npm install -g zerocase @megapixel99/didrun

      - name: the labelled set still scores what the README says
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "."); sys.path.insert(0, "fixtures")
          from nondet import check, functions_in
          from known import LABELS
          rows = [(n, LABELS[n], check("fixtures/known.py", n, a).state)
                  for n, a in functions_in("fixtures/known.py") if n in LABELS]
          missed = [n for n, e, g in rows if e == "nondeterministic" and g != e]
          false  = [n for n, e, g in rows if e == "deterministic" and g == "nondeterministic"]
          caught = [n for n, e, g in rows if e == "nondeterministic" and g == e]
          looked = sorted(n for n, e, g in rows if e == "deterministic" and g == "look")
          print(f"{len(rows)} labelled, {len(caught)} caught, {len(missed)} missed, {len(false)} false, {len(looked)} look")
          assert not missed, f"missed: {missed}"
          assert not false, f"false positives: {false}"
          # The README's third row. A `look` is never a finding, so a rule that starts
          # returning one for ordinary deterministic fixtures passes both asserts above.
          assert looked == ["always_raises"], f"unexpected looks: {looked}"
          # The denominators, so a fixture file that quietly emptied cannot pass this.
          assert len(caught) >= 9, f"only {len(caught)} nondeterministic fixtures"
          assert len(rows) >= 19, f"only {len(rows)} labelled fixtures"
          PY

      - name: pointed at itself
        # It should find nothing — and "found nothing" is also what a run that probed
        # nothing reports, in the same words and with the same 0. The comment this
        # replaces said a low probe rate shows up as a count; it showed up as a count
        # nothing read. `--json` puts the denominator in a named field and `zerocase`
        # reads it.
        #
        # THE FLOOR IS ON `deterministic`, NOT ON `functions`. A `look` is a function
        # the probe could not reach, so a floor on the total would be satisfied by a run
        # in which every rung raised and nothing inside any function ever ran — the
        # total-is-not-a-denominator case `zerocase` exists to argue with.
        #
        # 3 is the current number, and it is small on purpose rather than by accident:
        # most of this package's own functions take a path or a callable, every rung of
        # a scalar ladder is the wrong type, and the call raises on the way in. That is
        # a `look`, exactly as the README describes for the shape.
        run: |
          set +e
          zerocase --json /tmp/self.json:deterministic --min-json 3 \
            -- bash -c 'set -o pipefail; python3 -m nondet.cli nondet --json | tee /tmp/self.json'
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            echo "::error::nondet found nondeterminism in its own source"
            exit 1
          fi
          if [ "$code" -eq 3 ]; then
            echo "::error::nondet settled too few of its own functions for a clean run to mean anything"
            exit 1
          fi
          if [ "$code" -ne 0 ]; then
            echo "::error::nondet could not run over itself (exit $code)"
            exit 1
          fi

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: the counting tools
        # Installed as in `suite`; the argument for naming both is there.
        run: |
          if [ "$(node -p 'process.versions.node.split(".")[0]')" -lt 20 ]; then
            echo "::error::didrun and zerocase declare node >= 20; this runner has $(node --version)"
            exit 1
          fi
          npm install -g zerocase @megapixel99/didrun

      - name: install the built artifact, not the source tree
        # A packaging mistake — a missing module in `packages`, a broken entry point —
        # is invisible when the tests import from the working directory.
        #
        # EXIT 1 IS THE PASS HERE, which is the case an exit code is worst at. It means
        # "found nondeterminism", and the fixtures hold nine of them — but it also means
        # "found one", so a wheel whose `functions_in` shipped broken and located a
        # single function could satisfy this step by finding that one. `--min 19` reads
        # the census the CLI prints and refuses that.
        #
        # `--expect-failure` covers the other half: exiting non-zero is not the same as
        # having caught something, and scoring the two alike is how a packaging test
        # comes to report success for a package it never loaded. A run that printed its
        # census and then failed some other way is exit 4; a run that printed no census
        # at all — a broken entry point, a missing module — is exit 3. Both are named
        # below, because "the wheel is broken" and "the wheel found nothing" send you to
        # different places, and neither is the exit 1 this step wants.
        run: |
          python3 -m pip install --quiet build
          python3 -m build --wheel --outdir /tmp/dist
          python3 -m pip install --quiet /tmp/dist/*.whl
          cp fixtures/known.py /tmp/known.py
          cd /tmp   # away from the source tree, so an import can only come from the wheel
          nondet --help
          set +e
          didrun --expect-count '([0-9]+) functions:' --min 19 \
                 --expect-failure 'nondeterministic' \
                 -- nondet /tmp/known.py --quiet
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo "::error::the packaged CLI printed no census — it did not probe the fixtures"
            exit 1
          fi
          if [ "$code" -eq 4 ]; then
            echo "::error::the packaged CLI failed, but not by finding nondeterminism"
            exit 1
          fi
          if [ "$code" -ne 1 ]; then
            echo "::error::the fixtures hold known nondeterministic functions; expected exit 1, got $code"
            exit 1
          fi
